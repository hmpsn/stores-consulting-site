copy:
  title1: Results
  description2: Typical ranges and outcomes delivered across tSCG retail execution engagements.
  eyebrow3: Proof, Not Promises
  title4: We measure results the way your finance team would.
  description5: Every range on this page reflects what's actually been delivered across our engagement history — not a best-case scenario or an industry average borrowed from somewhere else.
  title6: These ranges reflect decades of engagements.
  description7: Yours starts with a diagnostic, not a number pulled from a page.
  text8: Typical Results
  text9: Delivering consistent, proven results that impact the bottom line.
  text10: Every engagement is scoped to the specific gap in front of it.
  text11: How We Guard Against Overstating It
  text12: Ranges, not best-case numbers
  text13: Every figure on this page is a range pulled from actual engagement outcomes, not the single best result we've ever delivered.
  text14: Scoped to the real gap, every time
  text15: A diagnostic determines which of these drivers actually applies before any number gets attached to a proposal.
resultGroups:
  - title: Labor Performance
    items:
      - 5–15% typical labor productivity improvement
      - 5–20% reduction in transaction times
      - 15–30% non-sell task reduction
      - 30–80% reduction in cash-handling hours
      - Truck-to-shelf times cut significantly
  - title: Customer Experience & Sales
    items:
      - Up to 7% total store sales gains
      - Customer satisfaction scores up 20–30%
      - In-stock position improved storewide
      - Greet and engagement measurably increased
      - “Silent service” standards support legendary in-store experience
  - title: Shrink & Lost Profitability
    items:
      - 20–60% reduced shrink and waste
      - Increased price accuracy and scan rates
      - Theft and organized retail crime deterrence
      - Associate awareness and accountability
      - DSD vendor management and credit recovery
  - title: Store Execution
    items:
      - 100–400+ bps typical contribution margin improvement through foundational execution
      - PLU and schematic compliance closes the gap between planogram and shelf
      - 5S discipline removes the friction that quietly erodes margin
      - Shelf-tag and case-tag accuracy protect price integrity
      - Improved in-stock position captures sales that were already there to be made

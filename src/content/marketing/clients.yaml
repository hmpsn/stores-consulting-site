copy:
  title1: Clients
  description2: A representative sample of national and regional retailers served by the Stores Consulting Group.
  title3: 100+ retailers since 2009. A few who've let us say so.
  description4: We don't publish a client list — most engagements stay confidential, and we honor that by default. What follows is a representative sample of organizations who've specifically given us permission to use their name.
  title5: $12B in profit created, across every kind of store there is.
  description6: That's not luck. That's a portable standard.
  text7: A sample, not a roster — dozens more across grocery, specialty, convenience, and value retail, under the confidentiality every engagement starts with by default.
  text8: Legacy Client Profiles
  text9: Existing project URLs, preserved.
  text10: Every public WordPress client/project entry remains available at its original route.

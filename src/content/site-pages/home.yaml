pageType: home
metadata:
  title: the Stores Consulting Group
  description: Retail execution consulting that closes the gap between what technology promises and what stores actually deliver.
hero:
  headline: Retailers have the AI. Most aren't capturing
  emphasis: the return
  description: 'the Stores Consulting Group closes the gap between what your technology promises and what your stores actually deliver — foundational retail execution, built for the AI era.'
  primaryAction:
    label: See How We Work
    href: /approach/
  secondaryAction:
    label: Talk to Us
    href: /contact-us/
  image:
    src: /assets/editorial/wp-content/uploads/2016/09/iStock-543570406_2.jpg
